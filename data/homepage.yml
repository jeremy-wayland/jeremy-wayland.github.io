# experience
experience:
  enable: true
  title: "Experience"
  description: "I studied mathematics and astrophysics at <a target='_blank' href='https://www.berkeley.edu/'>UC Berkeley</a>, then completed a master's in computational and data sciences at <a target='_blank' href='https://www.chapman.edu/'>Chapman University</a>. Along the way, I worked as an ML consultant at <a target='_blank' href='https://www.madiba.com/'>Madiba</a> and as a research developer at <a target='_blank' href='https://www.encryptek.net/'>Encryptek</a>. <br/><br/> That path led to CHOC, where I worked with <a target='_blank' href='https://scholar.google.com/citations?user=xu4laD8AAAAJ&hl=en'>Louis Ehwerhemuepha</a> as a grant-funded research scientist on predictive models for pediatric sepsis—and found my way into computational topology. I then joined <a target='_blank' href='https://bastian.rieck.me/'>Bastian Rieck's</a> <a target='_blank' href='https://aidos.group/'>AIDOS Lab</a> at the University of Fribourg to pursue a PhD in topological and geometric deep learning. <br/><br/> During my PhD, <a target='_blank' href='https://stuartwayland.github.io/'>Stuart Wayland</a>, <a target='_blank' href='https://www.linkedin.com/in/sidney-gathrid/'>Sidney Gathrid</a>, and I began collaborating on various projects. In one particularly fun project, we used Riemannian curvature and topological data analysis to study the phase-out of US coal power plants (now published in <a target='_blank' href='https://www.nature.com/articles/s41560-025-01871-0'>Nature Energy</a>). We decided we loved working together and wanted to keep doing it, so we founded <a target='_blank' href='https://trials.krv.ai/'>Krv Labs</a>. Krv (<em>Kepler Riemann von Neumann</em>) pays homage to some of the scientists we look up to who refused to accept 'good enough'. We bring that same standard to our work in healthcare, translating methods from mathematics, physics, and machine learning into safe, effective, and evidence-backed AI."
  
